<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourHub | Powered by Lakshitha</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* පසුබිමේ ලෝගෝ එක පේන විදිය (Watermark Effect) */
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: url('https://i.ibb.co/v4m8Y9S/Your-Hub-Logo.png') no-repeat center; /* මෙතනට ඔයාගේ ලෝගෝ ලින්ක් එක දාන්න පුළුවන් */
            background-size: contain;
            opacity: 0.05; /* ඉතා අඩුවෙන් පේන්න */
            z-index: -1;
        }

        /* Login Page Section */
        #login-page {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #111 0%, #000 100%);
        }

        .login-card {
            background: rgba(20, 20, 20, 0.8);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.1);
            width: 90%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #333;
            backdrop-filter: blur(10px);
        }

        .login-logo {
            width: 80px;
            margin-bottom: 10px;
        }

        .login-card h2 {
            margin-bottom: 5px;
            color: #fff;
            font-size: 24px;
        }

        .tagline {
            font-size: 10px;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #aaa;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #111;
            color: white;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #ff0000; /* ලෝගෝ එකේ රතු පාට */
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .login-btn:hover { background: #cc0000; transform: scale(1.02); }

        /* Main Site Section */
        #main-site { display: none; }

        nav {
            background: rgba(10, 10, 10, 0.9);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .nav-logo { font-size: 20px; font-weight: 600; color: #ff0000; }

        .hero {
            height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .services {
            padding: 40px 5%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: #111;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #222;
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #222;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-card">
            <h2 style="color: #fff;">Your<span style="background: red; padding: 2px 8px; border-radius: 5px; margin-left: 5px;">Hub</span></h2>
            <p class="tagline">Powered by Lakshitha</p>

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="admin">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="1234">
            </div>
            <button class="login-btn" onclick="checkLogin()">Login</button>
            <p id="error-msg" style="color: #ff4444; margin-top: 15px; font-size: 13px; display: none;">Invalid Login!</p>
        </div>
    </div>

    <div id="main-site">
        <nav>
            <div class="nav-logo">YourHub</div>
            <div style="cursor:pointer; color: #555;" onclick="location.reload()">Logout 🔒</div>
        </nav>

        <header class="hero">
            <h1>Welcome, Lakshitha</h1>
            <p style="color: #888;">System Developer Dashboard</p>
        </header>

        <section class="services">
            <div class="card"><h3>Projects</h3><p>Manage your web builds.</p></div>
            <div class="card"><h3>Database</h3><p>Secure system storage.</p></div>
            <div class="card"><h3>Settings</h3><p>Profile and API keys.</p></div>
        </section>

        <footer>
            <p>YourHub &copy; 2026</p>
            <p style="letter-spacing: 1px;">POWERED BY LAKSHITHA</p>
        </footer>
    </div>

    <script>
        function checkLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === "admin" && p === "1234") {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('main-site').style.display = 'block';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }
    </script>

</body>
</html>
