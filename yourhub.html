<style>
    /* ... අනෙක් ඒවා එහෙම්මම තියන්න ... */
    body.logged-in {
        overflow-y: auto !important;
    }
</style>

<script>
    function checkLogin() {
        const u = document.querySelector('#username').value;
        const p = document.querySelector('#password').value;
        const errorMsg = document.getElementById('error-msg');
        
        if (u === "admin" && p === "1234") {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-site').style.display = 'block';
            
            // Body එක scroll කරන්න පුළුවන් විදිහට හදනවා
            document.body.classList.add('logged-in');
            document.body.style.overflow = 'visible'; 
        } else {
            errorMsg.style.display = 'block';
            // වැරදුණාම password එක clear කරනවා
            document.querySelector('#password').value = "";
        }
    }

    // Enter key එක ගැහුවම login වෙන්න
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            checkLogin();
        }
    });
</script>
